<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting&hellip;</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #16181d;
    color: #e6e6e6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .box { text-align: center; padding: 24px; }
  .spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border: 3px solid #3a3f4a;
    border-top-color: #7aa2f7;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.15rem; font-weight: 500; margin: 0 0 8px; }
  p { margin: 0; color: #9aa0ac; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>Starting your dev environment&hellip;</h1>
  <p>This page reloads on its own when the service is ready.</p>
  <noscript><meta http-equiv="refresh" content="3"></noscript>
</div>
<script>
  (function poll() {
    fetch(location.href, { cache: "no-store" })
      .then(function (r) {
        if (r.headers.get("X-Gatekeeper-State") !== "starting") {
          location.reload();
          return;
        }
        setTimeout(poll, 1500);
      })
      .catch(function () { setTimeout(poll, 3000); });
  })();
</script>
</body>
</html>
