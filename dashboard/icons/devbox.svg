<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="devbox logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- soft inner light -->
 <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lid)"/>

  <!-- open box lid -->
  <path d="M96 176 L256 96 L416 176 L256 256 Z" fill="#ffffff" opacity="0.28"/>
  <path d="M96 176 L256 256 L256 296 L96 216 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M416 176 L256 256 L256 296 L416 216 Z" fill="#000000" opacity="0.12"/>

  <!-- box body -->
  <rect x="96" y="192" width="320" height="224" rx="36" fill="#0f1115"/>
  <rect x="96" y="192" width="320" height="224" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="8"/>
  <circle cx="130" cy="226" r="9" fill="#f87171" opacity="0.85"/>
  <circle cx="158" cy="226" r="9" fill="#fbbf24" opacity="0.85"/>
  <circle cx="186" cy="226" r="9" fill="#34d399" opacity="0.85"/>

  <!-- terminal prompt -->
  <path d="M140 268 L196 312 L140 356" fill="none" stroke="#67e8f9" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="228" y="336" width="112" height="26" rx="13" fill="#67e8f9"/>
</svg>
